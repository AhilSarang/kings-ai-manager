[project]
name = "kings-ai-manager"
version = "0.1.0"
description = "Kings Distro AI Business Manager: Supervisor, WhatsApp channel, task system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "anthropic>=0.40",
    "python-multipart>=0.0.9",
    "tzdata>=2024.1",
    "cryptography>=50.0.1",
    "google-auth>=2.58.0",
    "requests>=2.34.2",
    "jsonschema>=4.23",
    "pillow>=11.0",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pgserver>=0.1.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
faulthandler_timeout = 60
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.uv]
package = false
