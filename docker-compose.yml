name: kings-ai-manager

x-app-env: &app-env
  env_file: .env
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  db:
    image: postgres:16
    <<: *app-env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kings}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-kings_ai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: { context: ., target: base }
    <<: *app-env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    ports:
      - "127.0.0.1:8000:8000"   # only Caddy (added in M9) is exposed publicly
    volumes:
      - files:/data/files
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: { context: ., target: worker }
    <<: *app-env
    command: python -m app.jobs.worker
    stop_grace_period: 60s   # let the current job finish
    volumes:
      - files:/data/files
    depends_on:
      db: { condition: service_healthy }
      api: { condition: service_started }   # api runs migrations first

volumes:
  pgdata:
  files:
