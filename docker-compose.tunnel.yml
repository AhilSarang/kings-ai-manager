services:
  api:
    # Meta sends the verification token in the query string; do not log it.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --no-access-log"
  webhook-test-proxy:
    image: nginx:stable-alpine
    restart: "no"
    volumes:
      - ./ops/whatsapp-test-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: { condition: service_healthy }
    security_opt: [no-new-privileges:true]
  whatsapp-test-tunnel:
    image: cloudflare/cloudflared:latest
    restart: "no"
    command: tunnel --no-autoupdate --url http://webhook-test-proxy:8080
    depends_on: [webhook-test-proxy]
    security_opt: [no-new-privileges:true]
